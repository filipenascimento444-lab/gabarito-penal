</head><body><title>Gabarito Penal</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: app de uma coluna (máx. 560px); os casos aparecem como "autos" datilografados e cada resposta recebe um carimbo DEFERIDO/INDEFERIDO */
:root{
  --paper:#eef1f5; --card:#ffffff; --doc:#fbfaf6; --ink:#1a2340; --muted:#5b6580; --line:#d6dce6; --soft:#e4e9f2;
  --toga:#24336b; --on-toga:#ffffff; --stamp:#c4362c; --ok:#1f8456; --gold:#b9840f;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Courier Prime","Courier New",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1321; --card:#171f33; --doc:#1c2439; --ink:#e6eaf3; --muted:#9aa4bc; --line:#2a3552; --soft:#212b44;
    --toga:#9db0f0; --on-toga:#0e1321; --stamp:#ff6f61; --ok:#46c58b; --gold:#f2bb3d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1321; --card:#171f33; --doc:#1c2439; --ink:#e6eaf3; --muted:#9aa4bc; --line:#2a3552; --soft:#212b44;
  --toga:#9db0f0; --on-toga:#0e1321; --stamp:#ff6f61; --ok:#46c58b; --gold:#f2bb3d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--toga);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
.display{font-family:var(--f-display);font-stretch:125%;font-weight:850;letter-spacing:-.01em;line-height:1.05;text-wrap:balance;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .display{font-size:1.45rem}
.brand small{font-size:.78rem;color:var(--muted)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1rem;flex:none}

/* ficha do servidor */
.ficha{background:var(--toga);color:var(--on-toga);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.seal{width:76px;height:76px;border-radius:50%;border:3px double currentColor;display:grid;place-items:center;text-align:center;transform:rotate(-8deg);flex:none}
.seal b{font-family:var(--f-display);font-stretch:125%;font-size:1.7rem;line-height:1;display:block}
.seal span{font-size:.55rem;letter-spacing:.14em;text-transform:uppercase}
.ficha h2{font-family:var(--f-display);font-stretch:110%;font-size:1.25rem;margin:0 0 6px;font-weight:800}
.xpbar{height:10px;border-radius:6px;background:color-mix(in srgb,var(--on-toga) 22%,transparent);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;margin-top:8px;opacity:.92}

/* botões */
.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:800;font-size:1rem;background:var(--toga);color:var(--on-toga);display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;width:100%;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--stamp);color:#fff}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.cta{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.cta .badge{width:52px;height:52px;border-radius:12px;background:var(--stamp);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:1.3rem;flex:none}
.cta div{min-width:0}
.cta b{display:block;font-size:1.05rem}
.cta span{font-size:.85rem;color:var(--muted)}
.cta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}

section{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shead h3{font-family:var(--f-display);font-stretch:112%;font-size:1.05rem;margin:0;font-weight:800}

/* pauta do dia */
.pauta{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.mis{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.mis:last-child{border-bottom:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:none;color:#fff}
.mis.done .box{background:var(--ok);border-color:var(--ok)}
.mis.done .t{text-decoration:line-through;color:var(--muted)}
.mis .x{margin-left:auto;font-size:.8rem;color:var(--muted)}

/* modos */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.mode .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--toga)}
.mode .ic svg{width:20px;height:20px}
.mode b{font-size:1rem;line-height:1.15}
.mode span{font-size:.8rem;color:var(--muted);line-height:1.3}
.mode .pill{position:absolute;top:12px;right:12px;background:var(--stamp);color:#fff;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:20px}
.mode .rec{font-size:.72rem;color:var(--gold);font-weight:700;margin-top:auto}

/* mapa de domínio */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.ht{border:0;border-radius:8px;padding:8px 2px;font-size:.78rem;font-weight:800;background:var(--soft);color:var(--ink)}
.ht.h1{background:color-mix(in srgb,var(--ok) 18%,var(--soft))}
.ht.h2{background:color-mix(in srgb,var(--ok) 35%,var(--soft))}
.ht.h3{background:color-mix(in srgb,var(--ok) 55%,var(--soft))}
.ht.h4{background:color-mix(in srgb,var(--ok) 75%,var(--soft));color:#fff}
.ht.h5{background:var(--ok);color:#fff}
.ht.bad{box-shadow:inset 0 0 0 2px var(--stamp)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}

/* carimbos (conquistas) */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stp{border:2px dashed var(--line);border-radius:10px;padding:10px 6px;text-align:center;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.stp b{font-size:.78rem;line-height:1.15}
.stp.on{border:2.5px solid var(--stamp);color:var(--stamp);transform:rotate(-3deg)}
.stp.on:nth-child(2n){transform:rotate(2deg)}
.stp i{font-style:normal;font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:1rem}

.foot{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.foot button{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.8rem;color:var(--muted)}

/* navegação */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding-block:8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.bar .brand{min-width:0}
.bar .display{font-size:1.15rem}
.back{border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:8px 14px 8px 10px;font-weight:800;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;min-height:44px;flex:none;color:var(--ink)}
.back .ch{font-size:1.3rem;line-height:1;margin-top:-2px}
.quitbar{background:var(--card);border:2px solid var(--stamp);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.quitbar span{font-size:.9rem;color:var(--muted)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;text-align:left}

/* rodada */
.rbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding-block:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.rtitle{font-weight:800;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstat{font-weight:800;font-size:.95rem;display:flex;gap:10px;align-items:center}
.hearts{color:var(--stamp);letter-spacing:2px;font-size:1.05rem}
.pbar,.tbar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.pbar i,.tbar i{display:block;height:100%;background:var(--toga);transition:width .3s}
.tbar i{background:var(--gold);transition:width .25s linear}
.tbar.low i{background:var(--stamp)}
.combo{font-size:.8rem;font-weight:800;color:var(--muted);height:1.2em}
.combo.on{color:var(--gold)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.chip{align-self:flex-start;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--toga);border:1.5px solid currentColor;border-radius:6px;padding:3px 8px}
.prompt{font-size:1.08rem;font-weight:650;margin:0;text-wrap:pretty}
.doc{font-family:var(--f-doc);font-size:.98rem;background:var(--doc);border:1px solid var(--line);border-left:4px solid var(--toga);border-radius:6px;padding:14px;line-height:1.55}
.doc .gap{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--stamp);color:var(--stamp);font-weight:700;text-align:center}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.two{flex-direction:row}
.opts.two .opt{justify-content:center;font-size:1.05rem;font-weight:800;padding:18px 10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:13px 14px;text-align:left;display:flex;gap:12px;align-items:flex-start;font-size:.97rem;line-height:1.35;min-height:52px;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt .lt{width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.82rem;flex:none}
.opt span:last-child{min-width:0}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 10%,var(--card))}
.opt.bad .lt{background:var(--stamp);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.stampmark{position:absolute;top:16px;right:12px;font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:1.25rem;letter-spacing:.06em;padding:4px 10px;border:3px solid currentColor;border-radius:6px;transform:rotate(-12deg);pointer-events:none;animation:stamp .32s cubic-bezier(.2,1.6,.4,1) both;background:color-mix(in srgb,var(--card) 70%,transparent)}
.stampmark.ok{color:var(--ok)}
.stampmark.bad{color:var(--stamp)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.fb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--ok)}
.fb.bad{border-top-color:var(--stamp)}
.fb h4{margin:0;font-family:var(--f-display);font-stretch:115%;font-size:1.1rem}
.fb p{margin:0;font-size:.95rem}
.fund{font-size:.8rem;font-weight:700;color:var(--toga)}
.dica{font-size:.88rem;background:var(--soft);border-radius:8px;padding:10px 12px}
.dica b{color:var(--gold)}
.gain{color:var(--gold);font-weight:800}
.next{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px))}

/* fim da rodada */
.sent{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;position:relative;overflow:hidden}
.sent .display{font-size:1.7rem}
.stars{font-size:2.1rem;letter-spacing:6px;color:var(--gold)}
.stars .off{color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.kpi{background:var(--soft);border-radius:10px;padding:10px 4px}
.kpi b{display:block;font-size:1.2rem;font-family:var(--f-display);font-stretch:110%}
.kpi span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.banner{width:100%;border-radius:10px;padding:12px;background:var(--gold);color:#1a1300;font-weight:800}
.errs{display:flex;flex-direction:column;gap:8px}
.err{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--stamp);border-radius:10px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.err .q{font-weight:650}
.err .a{color:var(--ok);font-weight:700}

/* mapa da campanha */
.trail{display:flex;flex-direction:column;gap:0;position:relative}
.node{display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:10px 0;width:100%;position:relative}
.node .dot{width:54px;height:54px;border-radius:50%;background:var(--toga);color:var(--on-toga);display:grid;place-items:center;font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:1.25rem;flex:none;position:relative;z-index:1;border:4px solid var(--paper)}
.node:nth-child(2n) {padding-left:34px}
.node .info{min-width:0;flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.node .info b{display:block;font-size:.98rem}
.node .info span{font-size:.8rem;color:var(--muted)}
.node .st{color:var(--gold);font-size:.95rem;letter-spacing:2px}
.node.lock .dot{background:var(--soft);color:var(--muted)}
.node.lock .info{opacity:.6}
.node.boss .dot{background:var(--stamp);color:#fff}
.node.done .dot{background:var(--ok);color:#fff}

/* vade mecum */
.search{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:var(--ink)}
details.art{background:var(--card);border:1px solid var(--line);border-radius:12px}
details.art summary{list-style:none;padding:13px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
details.art summary::-webkit-details-marker{display:none}
details.art summary .n{font-weight:800;font-size:.8rem;color:var(--toga);min-width:52px}
details.art summary .t{flex:1;min-width:0;font-weight:650;font-size:.95rem}
.mdot{width:10px;height:10px;border-radius:50%;background:var(--soft);flex:none}
.mdot.h1,.mdot.h2{background:color-mix(in srgb,var(--ok) 40%,var(--soft))}
.mdot.h3,.mdot.h4{background:color-mix(in srgb,var(--ok) 75%,var(--soft))}
.mdot.h5{background:var(--ok)}
.abody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.93rem}
.pena{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:.85rem;flex-wrap:wrap}
.reg{font-size:.7rem;font-weight:900;padding:2px 7px;border-radius:5px;color:#fff;background:var(--toga)}
.reg.D{background:var(--gold);color:#1a1300}
.abody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.vhead{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:.95rem;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:30px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center;animation:fade 2.6s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.howto{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:.9rem}
.howto summary{font-weight:800;cursor:pointer}
.howto ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
/* ================== CONTEÚDO: CÓDIGO PENAL ================== */
const VARAS=[
 {id:1,n:"Papéis e Selos",s:"Arts. 293 a 296 e 303",arts:["293","294","295","296","303"]},
 {id:2,n:"Documentos Falsos",s:"Arts. 297 a 302, 304 e 305",arts:["297","298","299","300","301","302","304","305"]},
 {id:3,n:"Identidade e Certames",s:"Arts. 307, 308 e 311-A",arts:["307","308","311-A"]},
 {id:4,n:"Peculato e Sistemas",s:"Arts. 312 a 315 e 327",arts:["312","313","313-A","313-B","314","315","327"]},
 {id:5,n:"Concussão e Corrupção",s:"Arts. 316, 317, 319, 319-A e 320",arts:["316","317","319","319-A","320"]},
 {id:6,n:"Deveres do Cargo",s:"Arts. 321 a 326",arts:["321","322","323","324","325","326"]},
 {id:7,n:"Particular x Administração",s:"Arts. 328 a 333, 336 e 337",arts:["328","329","330","331","332","333","336","337"]},
 {id:8,n:"Mentiras à Justiça",s:"Arts. 339 a 344",arts:["339","340","341","342","343","344"]},
 {id:9,n:"Justiça pelas Próprias Mãos",s:"Arts. 345 a 347, 357 e 359",arts:["345","346","347","357","359"]}
];

const PD="Reclusão, de 1 a 5 anos, e multa (doc. público); reclusão, de 1 a 3 anos, e multa (doc. particular)";
const ARTS=[
 // VARA 1
 {id:"293",n:"Falsificação de papéis públicos",t:"Falsificar, fabricando-os ou alterando-os: selo destinado a controle tributário, papel selado ou qualquer papel de emissão legal destinado à arrecadação de tributo; papel de crédito público que não seja moeda de curso legal; vale postal; cautela de penhor, caderneta de depósito de caixa econômica ou de estabelecimento mantido por entidade de direito público; talão, recibo, guia, alvará ou documento relativo a arrecadação de rendas públicas ou a depósito ou caução de responsabilidade do poder público; bilhete, passe ou conhecimento de empresa de transporte administrada pelo poder público.",pena:"Reclusão, de 2 a 8 anos, e multa",r:"R",o:["§1º Incorre na mesma pena quem usa, guarda, possui ou detém qualquer desses papéis falsificados (e quem comercializa selo tributário falsificado).","§2º Suprimir carimbo ou sinal indicativo de inutilização, para tornar os papéis novamente utilizáveis: reclusão, de 1 a 4 anos, e multa. §3º: mesma pena para quem usa esses papéis.","§4º Quem usa ou restitui à circulação, embora recebido de boa-fé, papel falsificado ou alterado, depois de conhecer a falsidade: detenção, de 6 meses a 2 anos, ou multa."],d:"Papéis públicos são os “papéis do dinheiro do Estado”: selo tributário, guia, alvará, vale postal, passe. Pena alta: 2 a 8."},
 {id:"294",n:"Petrechos de falsificação",t:"Fabricar, adquirir, fornecer, a título oneroso ou gratuito, possuir ou guardar objeto especialmente destinado à falsificação de qualquer dos papéis referidos no art. 293.",pena:"Reclusão, de 1 a 3 anos, e multa",r:"R",o:[],d:"Petrechos são as ferramentas do falsário. Guardar a máquina já é crime, mesmo sem falsificar nada."},
 {id:"295",n:"Aumento de pena: funcionário público (arts. 293 e 294)",t:"Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte.",pena:null,r:null,noq:1,o:[],d:"Funcionário + falsificação, prevalecendo-se do cargo = +1/6. A mesma fração aparece nos arts. 296, 297 e 299."},
 {id:"296",n:"Falsificação do selo ou sinal público",t:"Falsificar, fabricando-os ou alterando-os: selo público destinado a autenticar atos oficiais da União, de Estado ou de Município; selo ou sinal atribuído por lei a entidade de direito público, ou a autoridade, ou sinal público de tabelião.",pena:"Reclusão, de 2 a 6 anos, e multa",r:"R",o:["§1º Mesmas penas: quem faz uso do selo ou sinal falsificado; quem utiliza indevidamente o selo ou sinal verdadeiro em prejuízo de outrem ou em proveito próprio ou alheio; quem altera, falsifica ou faz uso indevido de marcas, logotipos, siglas ou símbolos de órgãos ou entidades da Administração Pública.","§2º Funcionário público que comete o crime prevalecendo-se do cargo: pena aumentada de sexta parte."],d:"Selo ou sinal público é o “carimbo oficial”, inclusive o sinal público de tabelião. Mesma pena do documento público: 2 a 6."},
 {id:"303",n:"Reprodução ou adulteração de selo ou peça filatélica",t:"Reproduzir ou alterar selo ou peça filatélica que tenha valor para coleção, salvo quando a reprodução ou a alteração está visivelmente anotada na face ou no verso do selo ou peça.",pena:"Detenção, de 1 a 3 anos, e multa",r:"D",o:["Parágrafo único: incorre nas mesmas penas quem, para fins de comércio, faz uso do selo ou peça filatélica."],d:"Filatelia é selo de coleção. Se a cópia está anotada na face ou no verso, não há crime."},
 // VARA 2
 {id:"297",n:"Falsificação de documento público",t:"Falsificar, no todo ou em parte, documento público, ou alterar documento público verdadeiro.",pena:"Reclusão, de 2 a 6 anos, e multa",r:"R",o:["§1º Funcionário público que comete o crime prevalecendo-se do cargo: pena aumentada de sexta parte.","§2º Equiparam-se a documento público: o emanado de entidade paraestatal, o título ao portador ou transmissível por endosso, as ações de sociedade comercial, os livros mercantis e o testamento particular.","§§3º e 4º: falsidades ligadas à Previdência Social (ex.: inserir pessoa sem qualidade de segurado na folha de pagamento; declaração falsa ou omissão de dados na CTPS)."],d:"Equiparados a público: Paraestatal, Título ao portador/endosso, Ações de sociedade comercial, Livros mercantis e Testamento particular. Cartão de crédito NÃO está aqui (é particular)."},
 {id:"298",n:"Falsificação de documento particular",t:"Falsificar, no todo ou em parte, documento particular ou alterar documento particular verdadeiro.",pena:"Reclusão, de 1 a 5 anos, e multa",r:"R",o:["Parágrafo único: equipara-se a documento particular o cartão de crédito ou débito."],d:"Cartão de crédito ou débito = documento PARTICULAR. Pena de 1 a 5."},
 {id:"299",n:"Falsidade ideológica",t:"Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante.",pena:PD,r:"R",o:["Parágrafo único: se o agente é funcionário público e comete o crime prevalecendo-se do cargo, ou se a falsificação ou alteração é de assentamento de registro civil, aumenta-se a pena de sexta parte."],d:"Ideológica: o papel é verdadeiro, o conteúdo é mentiroso. Público 1 a 5; particular 1 a 3."},
 {id:"300",n:"Falso reconhecimento de firma ou letra",t:"Reconhecer, como verdadeira, no exercício de função pública, firma ou letra que o não seja.",pena:PD,r:"R",o:[],d:"Crime de quem tem fé pública (ex.: tabelião). Penas iguais às da falsidade ideológica."},
 {id:"301",n:"Certidão ou atestado ideologicamente falso",t:"Atestar ou certificar falsamente, em razão de função pública, fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem.",pena:"Detenção, de 2 meses a 1 ano",r:"D",o:["§1º Falsidade material de atestado ou certidão: detenção, de 3 meses a 2 anos.","§2º Se o crime é praticado com o fim de lucro, aplica-se, além da pena privativa de liberdade, a de multa."],d:"Atestado do servidor: ideológico 2 meses a 1 ano; material (§1º) 3 meses a 2 anos. Fim de lucro: + multa."},
 {id:"301-1",p:"301",al:"Art. 301, §1º",n:"Falsidade material de atestado ou certidão",t:"Falsificar, no todo ou em parte, atestado ou certidão, ou alterar o teor de certidão ou de atestado verdadeiro, para prova de fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem.",pena:"Detenção, de 3 meses a 2 anos",r:"D",o:[],d:"Aqui o próprio papel é forjado ou alterado (falsidade material). Qualquer pessoa pode praticar."},
 {id:"302",n:"Falsidade de atestado médico",t:"Dar o médico, no exercício da sua profissão, atestado falso.",pena:"Detenção, de 1 mês a 1 ano",r:"D",o:["Parágrafo único: se o crime é cometido com o fim de lucro, aplica-se também multa."],d:"Crime próprio do médico. Pena baixinha: 1 mês a 1 ano (+ multa se houver fim de lucro)."},
 {id:"304",n:"Uso de documento falso",t:"Fazer uso de qualquer dos papéis falsificados ou alterados, a que se referem os arts. 297 a 302.",pena:"A cominada à falsificação ou à alteração",r:null,o:["Súmula 546 do STJ: a competência é definida pela entidade ou órgão ao qual o documento falso foi apresentado.","Súmula 17 do STJ: quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido."],d:"O uso não tem pena própria: “pega emprestada” a pena da falsificação correspondente."},
 {id:"305",n:"Supressão de documento",t:"Destruir, suprimir ou ocultar, em benefício próprio ou de outrem, ou em prejuízo alheio, documento público ou particular verdadeiro, de que não podia dispor.",pena:"Reclusão, de 2 a 6 anos, e multa (doc. público); reclusão, de 1 a 5 anos, e multa (doc. particular)",r:"R",o:[],d:"Documento VERDADEIRO destruído ou escondido. Penas: público 2 a 6; particular 1 a 5 (iguais às falsificações material)."},
 // VARA 3
 {id:"307",n:"Falsa identidade",t:"Atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem.",pena:"Detenção, de 3 meses a 1 ano, ou multa",r:"D",o:["Crime subsidiário: só se aplica se o fato não constitui elemento de crime mais grave.","Súmula 522 do STJ: a conduta de atribuir-se falsa identidade perante autoridade policial é típica, ainda que em situação de alegada autodefesa."],d:"Mentir o próprio nome à polícia é crime, sim (Súmula 522). Aqui não há uso de documento: é a mentira sobre quem se é."},
 {id:"308",n:"Uso de documento de identidade alheia",t:"Usar, como próprio, passaporte, título de eleitor, caderneta de reservista ou qualquer documento de identidade alheia ou ceder a outrem, para que dele se utilize, documento dessa natureza, próprio ou de terceiro.",pena:"Detenção, de 4 meses a 2 anos, e multa",r:"D",o:["Crime subsidiário: se o fato não constitui elemento de crime mais grave."],d:"308 = documento VERDADEIRO, mas de outra pessoa (ou ceder o seu para alguém usar)."},
 {id:"311-A",n:"Fraudes em certames de interesse público",t:"Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de: concurso público; avaliação ou exame públicos; processo seletivo para ingresso no ensino superior; ou exame ou processo seletivo previstos em lei.",pena:"Reclusão, de 1 a 4 anos, e multa",r:"R",o:["§1º Nas mesmas penas incorre quem permite ou facilita, por qualquer meio, o acesso de pessoas não autorizadas às informações sigilosas.","§2º Se da ação ou omissão resulta dano à administração pública: reclusão, de 2 a 6 anos, e multa.","§3º Aumenta-se a pena de 1/3 se o fato é cometido por funcionário público."],d:"Vazou prova (concurso, vestibular, exame previsto em lei)? 311-A. Dano à administração: 2 a 6. Funcionário: +1/3."},
 // VARA 4
 {id:"312",n:"Peculato",t:"Apropriar-se o funcionário público de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo, ou desviá-lo, em proveito próprio ou alheio.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:["§1º Peculato-furto: mesma pena se o funcionário, embora não tendo a posse, subtrai ou concorre para que seja subtraído, valendo-se da facilidade que a qualidade de funcionário lhe proporciona.","§2º Peculato culposo: detenção, de 3 meses a 1 ano.","§3º No culposo, a reparação do dano, se precede à sentença irrecorrível, extingue a punibilidade; se lhe é posterior, reduz de metade a pena imposta.","Súmula 599 do STJ: o princípio da insignificância é inaplicável aos crimes contra a administração pública."],d:"Apropriar (fica pra si) ou desviar (dá outro destino). Bem pode ser público OU particular. Culposo: reparou antes da sentença irrecorrível = extingue; depois = metade da pena."},
 {id:"312-1",p:"312",al:"Art. 312, §1º",n:"Peculato-furto",t:"Embora não tendo a posse do dinheiro, valor ou bem, o funcionário o subtrai, ou concorre para que seja subtraído, em proveito próprio ou alheio, valendo-se de facilidade que lhe proporciona a qualidade de funcionário.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:[],d:"Não tinha a posse, mas usou a facilidade do cargo (crachá, chave, acesso) para subtrair."},
 {id:"312-2",p:"312",al:"Art. 312, §2º",n:"Peculato culposo",t:"Se o funcionário concorre culposamente para o crime de outrem.",pena:"Detenção, de 3 meses a 1 ano",r:"D",o:["§3º Reparação do dano antes da sentença irrecorrível extingue a punibilidade; depois, reduz de metade a pena imposta."],d:"Descuido do servidor que permite o crime de outra pessoa. Único peculato com reparação que extingue a punibilidade."},
 {id:"313",n:"Peculato mediante erro de outrem",t:"Apropriar-se de dinheiro ou qualquer utilidade que, no exercício do cargo, recebeu por erro de outrem.",pena:"Reclusão, de 1 a 4 anos, e multa",r:"R",o:[],d:"Também chamado de peculato-estelionato. O erro é espontâneo da vítima; o funcionário só se aproveita."},
 {id:"313-A",n:"Inserção de dados falsos em sistema de informações",t:"Inserir ou facilitar, o funcionário autorizado, a inserção de dados falsos, alterar ou excluir indevidamente dados corretos nos sistemas informatizados ou bancos de dados da Administração Pública com o fim de obter vantagem indevida para si ou para outrem ou para causar dano.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:[],d:"313-A mexe nos DADOS (funcionário autorizado) e tem pena de peculato: 2 a 12."},
 {id:"313-B",n:"Modificação ou alteração não autorizada de sistema de informações",t:"Modificar ou alterar, o funcionário, sistema de informações ou programa de informática sem autorização ou solicitação de autoridade competente.",pena:"Detenção, de 3 meses a 2 anos, e multa",r:"D",o:["Parágrafo único: as penas são aumentadas de 1/3 até a metade se da modificação ou alteração resulta dano para a Administração Pública ou para o administrado."],d:"313-B mexe no SISTEMA/PROGRAMA, e pena de detenção. Dados = A (alto, reclusão); programa = B (baixo, detenção)."},
 {id:"314",n:"Extravio, sonegação ou inutilização de livro ou documento",t:"Extraviar livro oficial ou qualquer documento, de que tem a guarda em razão do cargo; sonegá-lo ou inutilizá-lo, total ou parcialmente.",pena:"Reclusão, de 1 a 4 anos",r:"R",o:["Subsidiário: se o fato não constitui crime mais grave.","Atenção: não há multa cominada."],d:"314 é do funcionário que TEM A GUARDA do documento. Se quem age é outra pessoa sobre documento custodiado, pense no 337."},
 {id:"315",n:"Emprego irregular de verbas ou rendas públicas",t:"Dar às verbas ou rendas públicas aplicação diversa da estabelecida em lei.",pena:"Detenção, de 1 a 3 meses, ou multa",r:"D",o:[],d:"O dinheiro continua no serviço público, só que em destino diferente do previsto em lei. Não há proveito próprio (se houver, é peculato)."},
 {id:"327",n:"Conceito de funcionário público",t:"Considera-se funcionário público, para os efeitos penais, quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública.",pena:null,r:null,noq:1,o:["§1º Equipara-se a funcionário público quem exerce cargo, emprego ou função em entidade paraestatal, e quem trabalha para empresa prestadora de serviço contratada ou conveniada para a execução de atividade típica da Administração Pública.","§2º A pena será aumentada da terça parte quando os autores forem ocupantes de cargos em comissão ou de função de direção ou assessoramento de órgão da administração direta, sociedade de economia mista, empresa pública ou fundação instituída pelo poder público."],d:"Transitório e sem salário também conta (ex.: mesário, jurado). Cargo em comissão, direção ou assessoramento: +1/3."},
 // VARA 5
 {id:"316",n:"Concussão",t:"Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:["Pena alterada pelo Pacote Anticrime (Lei 13.964/2019): antes era de 2 a 8 anos.","Crime formal: consuma-se com a exigência, ainda que a vantagem não seja entregue."],d:"Concussão = EXIGIR (o funcionário impõe). Pena igual à da corrupção: 2 a 12."},
 {id:"316-1",p:"316",al:"Art. 316, §1º",n:"Excesso de exação",t:"Se o funcionário exige tributo ou contribuição social que sabe ou deveria saber indevido, ou, quando devido, emprega na cobrança meio vexatório ou gravoso, que a lei não autoriza.",pena:"Reclusão, de 3 a 8 anos, e multa",r:"R",o:[],d:"Exação = cobrança de tributo. Cobrou o indevido OU cobrou o devido de forma vexatória: 3 a 8."},
 {id:"316-2",p:"316",al:"Art. 316, §2º",n:"Desvio do tributo recebido indevidamente",t:"Se o funcionário desvia, em proveito próprio ou de outrem, o que recebeu indevidamente para recolher aos cofres públicos.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:[],d:"Recebeu indevidamente para recolher aos cofres e desviou: 2 a 12."},
 {id:"317",n:"Corrupção passiva",t:"Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:["§1º A pena é aumentada de 1/3 se, em consequência da vantagem ou promessa, o funcionário retarda ou deixa de praticar qualquer ato de ofício ou o pratica infringindo dever funcional.","§2º Corrupção passiva privilegiada: detenção, de 3 meses a 1 ano, ou multa."],d:"Corrupção passiva = Solicitar, Receber ou Aceitar promessa (SRA). Concussão exige; corrupção pede ou aceita."},
 {id:"317-2",p:"317",al:"Art. 317, §2º",n:"Corrupção passiva privilegiada",t:"Se o funcionário pratica, deixa de praticar ou retarda ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem.",pena:"Detenção, de 3 meses a 1 ano, ou multa",r:"D",o:[],d:"Cedeu a PEDIDO ou INFLUÊNCIA de outra pessoa, sem vantagem. Na prevaricação, o motivo é interesse ou sentimento PESSOAL."},
 {id:"319",n:"Prevaricação",t:"Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal.",pena:"Detenção, de 3 meses a 1 ano, e multa",r:"D",o:[],d:"Prevaricação = “pra mim”: interesse ou sentimento PESSOAL (amizade, vingança, preguiça interessada)."},
 {id:"319-A",n:"Prevaricação imprópria (celular no presídio)",t:"Deixar o Diretor de Penitenciária e/ou agente público, de cumprir seu dever de vedar ao preso o acesso a aparelho telefônico, de rádio ou similar, que permita a comunicação com outros presos ou com o ambiente externo.",pena:"Detenção, de 3 meses a 1 ano",r:"D",o:[],d:"Omissão do diretor/agente quanto a celular ou rádio com o preso. Mesma faixa da prevaricação, mas sem multa."},
 {id:"320",n:"Condescendência criminosa",t:"Deixar o funcionário, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente.",pena:"Detenção, de 15 dias a 1 mês, ou multa",r:"D",o:[],d:"Condescendência = “dó” do subordinado (indulgência). Uma das menores penas: 15 dias a 1 mês."},
 // VARA 6
 {id:"321",n:"Advocacia administrativa",t:"Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário.",pena:"Detenção, de 1 a 3 meses, ou multa",r:"D",o:["Parágrafo único: se o interesse é ilegítimo, detenção, de 3 meses a 1 ano, além da multa."],d:"Interesse LEGÍTIMO já é crime. Se ilegítimo, a pena sobe (3 meses a 1 ano + multa)."},
 {id:"322",n:"Violência arbitrária",t:"Praticar violência, no exercício de função ou a pretexto de exercê-la.",pena:"Detenção, de 6 meses a 3 anos, além da pena correspondente à violência",r:"D",o:[],d:"Funcionário que agride no exercício (ou a pretexto) da função. Soma-se a pena da violência."},
 {id:"323",n:"Abandono de função",t:"Abandonar cargo público, fora dos casos permitidos em lei.",pena:"Detenção, de 15 dias a 1 mês, ou multa",r:"D",o:["§1º Se do fato resulta prejuízo público: detenção, de 3 meses a 1 ano, e multa.","§2º Se o fato ocorre em lugar compreendido na faixa de fronteira: detenção, de 1 a 3 anos, e multa."],d:"Escada do abandono: simples 15 dias a 1 mês; com prejuízo 3 meses a 1 ano; faixa de fronteira 1 a 3 anos."},
 {id:"324",n:"Exercício funcional ilegalmente antecipado ou prolongado",t:"Entrar no exercício de função pública antes de satisfeitas as exigências legais, ou continuar a exercê-la, sem autorização, depois de saber oficialmente que foi exonerado, removido, substituído ou suspenso.",pena:"Detenção, de 15 dias a 1 mês, ou multa",r:"D",o:[],d:"Começou cedo demais ou ficou depois da hora (já sabendo oficialmente da exoneração, remoção, substituição ou suspensão)."},
 {id:"325",n:"Violação de sigilo funcional",t:"Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo, ou facilitar-lhe a revelação.",pena:"Detenção, de 6 meses a 2 anos, ou multa",r:"D",o:["Subsidiário: se o fato não constitui crime mais grave.","§1º Nas mesmas penas incorre quem: I – permite ou facilita, mediante atribuição, fornecimento e empréstimo de senha ou qualquer outra forma, o acesso de pessoas não autorizadas a sistemas de informações ou banco de dados da Administração Pública; II – se utiliza, indevidamente, do acesso restrito.","§2º Se da ação ou omissão resulta dano à Administração Pública ou a outrem: reclusão, de 2 a 6 anos, e multa."],d:"Revelou segredo do cargo ou emprestou a senha do sistema. Com dano, vira reclusão de 2 a 6."},
 {id:"325-2",p:"325",al:"Art. 325, §2º",n:"Violação de sigilo funcional qualificada",t:"Se da ação ou omissão resulta dano à Administração Pública ou a outrem.",pena:"Reclusão, de 2 a 6 anos, e multa",r:"R",o:[],d:"O dano transforma detenção em reclusão: 2 a 6 anos."},
 {id:"326",n:"Violação do sigilo de proposta de concorrência",t:"Devassar o sigilo de proposta de concorrência pública, ou proporcionar a terceiro o ensejo de devassá-lo.",pena:"Detenção, de 3 meses a 1 ano, e multa",r:"D",noq:1,o:["Atenção: a doutrina majoritária considera este artigo tacitamente revogado pela legislação de licitações (hoje, art. 337-J do CP, incluído pela Lei 14.133/2021). Confira como o seu edital o trata."],d:"Artigo de baixa incidência: o tema hoje está nos crimes em licitações (art. 337-J)."},
 // VARA 7
 {id:"328",n:"Usurpação de função pública",t:"Usurpar o exercício de função pública.",pena:"Detenção, de 3 meses a 2 anos, e multa",r:"D",o:["Parágrafo único: se do fato o agente aufere vantagem: reclusão, de 2 a 5 anos, e multa."],d:"Particular que ASSUME a função (age como se fosse o oficial). Com vantagem: reclusão de 2 a 5."},
 {id:"328-1",p:"328",al:"Art. 328, parágrafo único",n:"Usurpação de função pública com vantagem",t:"Se do fato (usurpar o exercício de função pública) o agente aufere vantagem.",pena:"Reclusão, de 2 a 5 anos, e multa",r:"R",o:[],d:"Vantagem auferida = reclusão, 2 a 5."},
 {id:"329",n:"Resistência",t:"Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio.",pena:"Detenção, de 2 meses a 2 anos",r:"D",o:["§1º Se o ato, em razão da resistência, não se executa: reclusão, de 1 a 3 anos.","§2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência."],d:"Resistência = violência ou ameaça contra ato LEGAL. Se o ato não se executa: reclusão de 1 a 3."},
 {id:"329-1",p:"329",al:"Art. 329, §1º",n:"Resistência qualificada",t:"Se o ato, em razão da resistência, não se executa.",pena:"Reclusão, de 1 a 3 anos",r:"R",o:[],d:"Deu certo resistir? Pior para o agente: reclusão de 1 a 3."},
 {id:"330",n:"Desobediência",t:"Desobedecer a ordem legal de funcionário público.",pena:"Detenção, de 15 dias a 6 meses, e multa",r:"D",o:[],d:"Só não obedece, sem violência. Se usar violência ou ameaça para impedir o ato, é resistência."},
 {id:"331",n:"Desacato",t:"Desacatar funcionário público no exercício da função ou em razão dela.",pena:"Detenção, de 6 meses a 2 anos, ou multa",r:"D",o:["O STJ (3ª Seção) e o STF reconhecem a validade do tipo de desacato."],d:"Desacato = humilhar, ofender, menosprezar o funcionário no exercício da função ou em razão dela."},
 {id:"332",n:"Tráfico de influência",t:"Solicitar, exigir, cobrar ou obter, para si ou para outrem, vantagem ou promessa de vantagem, a pretexto de influir em ato praticado por funcionário público no exercício da função.",pena:"Reclusão, de 2 a 5 anos, e multa",r:"R",o:["Parágrafo único: a pena é aumentada da METADE se o agente alega ou insinua que a vantagem é também destinada ao funcionário."],d:"“Vendedor de fumaça” sobre funcionário público em geral: aumento da METADE. Se for juiz, MP, testemunha etc., é exploração de prestígio (art. 357, aumento de 1/3)."},
 {id:"333",n:"Corrupção ativa",t:"Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício.",pena:"Reclusão, de 2 a 12 anos, e multa",r:"R",o:["Parágrafo único: a pena é aumentada de 1/3 se, em razão da vantagem ou promessa, o funcionário retarda ou omite ato de ofício, ou o pratica infringindo dever funcional.","Crime formal: consuma-se com a oferta ou promessa, mesmo que recusada."],d:"Corrupção ativa = OFERECER ou PROMETER. Quem só paga depois que o funcionário pediu não pratica 333."},
 {id:"336",n:"Inutilização de edital ou de sinal",t:"Rasgar ou, de qualquer forma, inutilizar ou conspurcar edital afixado por ordem de funcionário público; violar ou inutilizar selo ou sinal empregado, por determinação legal ou por ordem de funcionário público, para identificar ou cerrar qualquer objeto.",pena:"Detenção, de 1 mês a 1 ano, ou multa",r:"D",o:[],d:"Rasgou edital afixado ou rompeu lacre oficial. Conspurcar = sujar."},
 {id:"337",n:"Subtração ou inutilização de livro ou documento",t:"Subtrair, ou inutilizar, total ou parcialmente, livro oficial, processo ou documento confiado à custódia de funcionário, em razão de ofício, ou de particular em serviço público.",pena:"Reclusão, de 2 a 5 anos",r:"R",o:["Subsidiário: se o fato não constitui crime mais grave.","Atenção: não há multa cominada."],d:"337 = alguém (normalmente particular) ataca documento que está sob custódia do funcionário. Se é o próprio guardião, é o 314."},
 // VARA 8
 {id:"339",n:"Denunciação caluniosa",t:"Dar causa à instauração de inquérito policial, de procedimento investigatório criminal, de processo judicial, de processo administrativo disciplinar, de inquérito civil ou de ação de improbidade administrativa contra alguém, imputando-lhe crime, infração ético-disciplinar ou ato ímprobo de que o sabe inocente.",pena:"Reclusão, de 2 a 8 anos, e multa",r:"R",o:["Redação dada pela Lei 14.110/2020.","§1º A pena é aumentada de sexta parte se o agente se serve de anonimato ou de nome suposto.","§2º A pena é diminuída de metade se a imputação é de prática de contravenção."],d:"Tem VÍTIMA determinada e gera procedimento. Anonimato/nome suposto: +1/6. Contravenção: metade."},
 {id:"340",n:"Comunicação falsa de crime ou de contravenção",t:"Provocar a ação de autoridade, comunicando-lhe a ocorrência de crime ou de contravenção que sabe não se ter verificado.",pena:"Detenção, de 1 a 6 meses, ou multa",r:"D",o:[],d:"Crime fantasma, SEM apontar culpado. Se apontar pessoa determinada e gerar procedimento, é denunciação caluniosa."},
 {id:"341",n:"Autoacusação falsa",t:"Acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem.",pena:"Detenção, de 3 meses a 2 anos, ou multa",r:"D",o:[],d:"“Fui eu!” — mas não foi (ou o crime nem existiu)."},
 {id:"342",n:"Falso testemunho ou falsa perícia",t:"Fazer afirmação falsa, ou negar ou calar a verdade como testemunha, perito, contador, tradutor ou intérprete em processo judicial, ou administrativo, inquérito policial, ou em juízo arbitral.",pena:"Reclusão, de 2 a 4 anos, e multa",r:"R",o:["§1º As penas aumentam-se de 1/6 a 1/3 se o crime é praticado mediante suborno ou se cometido com o fim de obter prova destinada a produzir efeito em processo penal, ou em processo civil em que for parte entidade da administração pública direta ou indireta.","§2º O fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade."],d:"Mentir, negar ou calar a verdade. Retratou-se ANTES DA SENTENÇA = deixa de ser punível."},
 {id:"343",n:"Corrupção ativa de testemunha ou perito",t:"Dar, oferecer ou prometer dinheiro ou qualquer outra vantagem a testemunha, perito, contador, tradutor ou intérprete, para fazer afirmação falsa, negar ou calar a verdade em depoimento, perícia, cálculos, tradução ou interpretação.",pena:"Reclusão, de 3 a 4 anos, e multa",r:"R",o:["Parágrafo único: as penas aumentam-se de 1/6 a 1/3 se o crime é cometido com o fim de obter prova destinada a produzir efeito em processo penal ou em processo civil em que for parte entidade da administração pública direta ou indireta."],d:"Aqui o verbo DAR existe (diferente do 333). Pena curiosa: 3 a 4 anos, maior que a do próprio falso testemunho."},
 {id:"344",n:"Coação no curso do processo",t:"Usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade, parte, ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, ou em juízo arbitral.",pena:"Reclusão, de 1 a 4 anos, e multa, além da pena correspondente à violência",r:"R",o:["Parágrafo único: a pena aumenta-se de 1/3 até a metade se o processo envolver crime contra a dignidade sexual (Lei 14.245/2021)."],d:"Ameaçar testemunha, vítima, juiz ou parte para influenciar o processo. Crime contra a dignidade sexual: +1/3 até metade."},
 // VARA 9
 {id:"345",n:"Exercício arbitrário das próprias razões",t:"Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite.",pena:"Detenção, de 15 dias a 1 mês, ou multa, além da pena correspondente à violência",r:"D",o:["Parágrafo único: se não há emprego de violência, somente se procede mediante queixa."],d:"A pretensão pode ser LEGÍTIMA (cobrar dívida real). Sem violência = ação privada (queixa)."},
 {id:"346",n:"Subtração ou dano de coisa própria em poder de terceiro",t:"Tirar, suprimir, destruir ou danificar coisa própria, que se acha em poder de terceiro por determinação judicial ou convenção.",pena:"Detenção, de 6 meses a 2 anos, e multa",r:"D",o:[],d:"A coisa é DO PRÓPRIO agente, mas está com terceiro por ordem judicial ou contrato (ex.: bem penhorado com depositário)."},
 {id:"347",n:"Fraude processual",t:"Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito.",pena:"Detenção, de 3 meses a 2 anos, e multa",r:"D",o:["Parágrafo único: se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em DOBRO."],d:"Mexer na cena para enganar juiz ou perito. Processo penal, mesmo não iniciado: pena em dobro."},
 {id:"357",n:"Exploração de prestígio",t:"Solicitar ou receber dinheiro ou qualquer outra utilidade, a pretexto de influir em juiz, jurado, órgão do Ministério Público, funcionário de justiça, perito, tradutor, intérprete ou testemunha.",pena:"Reclusão, de 1 a 5 anos, e multa",r:"R",o:["Parágrafo único: as penas aumentam-se de 1/3 se o agente alega ou insinua que o dinheiro ou utilidade também se destina a qualquer das pessoas referidas."],d:"Tráfico de influência “da Justiça”: juiz, jurado, MP, funcionário de justiça, perito, tradutor, intérprete, testemunha. Aumento de 1/3."},
 {id:"359",n:"Desobediência a decisão judicial sobre perda ou suspensão de direito",t:"Exercer função, atividade, direito, autoridade ou múnus, de que foi suspenso ou privado por decisão judicial.",pena:"Detenção, de 3 meses a 2 anos, ou multa",r:"D",o:[],d:"O juiz suspendeu ou privou do direito e a pessoa continua exercendo."}
];

/* Casos no balcão: a = resposta, op = alternativas (ids), e = explicação */
const CASOS=[
 {a:"316",op:["316","317","333","332"],t:"Fiscal municipal avisa o dono de um restaurante: “ou você me paga R$ 2.000, ou eu fecho seu estabelecimento amanhã”. O comerciante não paga.",e:"O fiscal EXIGIU a vantagem, em razão da função. Concussão é crime formal: consuma-se com a exigência, mesmo sem pagamento."},
 {a:"317",op:["317","316","321","332"],t:"Servidor do cartório judicial insinua ao advogado que “um agrado” de R$ 500 faria o processo andar mais rápido.",e:"Ele SOLICITOU (pediu, sem impor) vantagem indevida em razão da função: corrupção passiva."},
 {a:"333",op:["333","317","332","330"],t:"Parado numa blitz, o motorista oferece R$ 200 ao policial para não ser autuado. O policial recusa e dá voz de prisão.",e:"OFERECER vantagem indevida para o funcionário omitir ato de ofício é corrupção ativa, consumada com a simples oferta, ainda que recusada."},
 {a:"312",op:["312","313","314","337"],t:"Escrevente leva para casa, definitivamente, o notebook do fórum que estava sob sua responsabilidade em razão do cargo.",e:"Apropriou-se de bem de que tinha a posse em razão do cargo: peculato-apropriação (art. 312, caput)."},
 {a:"312-1",op:["312-1","313","337","312-2"],t:"Servidor que não tem a guarda do almoxarifado usa o crachá funcional, que lhe dá acesso ao prédio, para subtrair caixas de papel e tonners.",e:"Sem a posse do bem, ele subtraiu valendo-se da facilidade proporcionada pela qualidade de funcionário: peculato-furto (§1º)."},
 {a:"312-2",op:["312-2","312","319","323"],t:"Por descuido, servidora deixa aberta a sala do almoxarifado ao sair. Durante a noite, um terceiro entra e furta computadores.",e:"Ela concorreu culposamente para o crime de outrem: peculato culposo. Se reparar o dano antes da sentença irrecorrível, extingue-se a punibilidade."},
 {a:"313",op:["313","312","316","317"],t:"Contribuinte, por engano, paga duas vezes a mesma taxa no guichê. O servidor percebe o erro e embolsa o valor pago a mais.",e:"Apropriou-se de dinheiro que recebeu, no exercício do cargo, por erro de outrem: peculato mediante erro de outrem (peculato-estelionato)."},
 {a:"313-A",op:["313-A","313-B","299","325"],t:"Funcionária autorizada a operar o sistema da Previdência insere vínculos de emprego inexistentes para que um amigo obtenha aposentadoria.",e:"Funcionário autorizado inserindo dados falsos no sistema para obter vantagem indevida: art. 313-A (reclusão de 2 a 12)."},
 {a:"313-B",op:["313-B","313-A","325","297"],t:"Servidor do setor de TI, sem autorização da chefia, altera o código do programa do órgão que calcula as diárias.",e:"Modificar programa de informática sem autorização ou solicitação da autoridade competente: art. 313-B (detenção)."},
 {a:"314",op:["314","337","305","336"],t:"Irritada com um advogado, a escrevente responsável pela guarda dos autos inutiliza documentos que estavam sob sua guarda em razão do cargo.",e:"Funcionária que inutiliza documento de que TEM A GUARDA em razão do cargo: art. 314."},
 {a:"337",op:["337","314","305","346"],t:"Ao consultar um processo no balcão, a parte arranca e leva consigo folhas dos autos que estavam sob a custódia do escrevente.",e:"Subtrair documento ou processo confiado à custódia de funcionário: art. 337 (crime praticado normalmente por particular)."},
 {a:"315",op:["315","312","319","321"],t:"Secretário estadual usa verba que a lei vinculava à compra de medicamentos para reformar a sede da secretaria. Não há proveito pessoal.",e:"Deu às verbas públicas aplicação diversa da estabelecida em lei, sem proveito próprio: art. 315."},
 {a:"319",op:["319","320","317","317-2"],t:"Escrevente deixa de juntar a petição aos autos por semanas porque o advogado é seu desafeto.",e:"Retardou ato de ofício para satisfazer sentimento pessoal (desafeto): prevaricação."},
 {a:"317-2",op:["317-2","319","320","321"],t:"Agente de trânsito, sem receber nada, deixa de lavrar uma multa porque um vereador influente pediu que “desse um jeito”.",e:"Deixou de praticar ato de ofício, com infração de dever, CEDENDO A PEDIDO OU INFLUÊNCIA de outrem: corrupção passiva privilegiada (§2º do art. 317)."},
 {a:"320",op:["320","319","317-2","321"],t:"Chefe de seção descobre que um subordinado cometeu infração no exercício do cargo e, por pena dele, decide não responsabilizá-lo.",e:"Por indulgência, deixou de responsabilizar subordinado: condescendência criminosa."},
 {a:"319-A",op:["319-A","319","320","317"],t:"Diretor de penitenciária, ciente de que presos usam celulares nas celas, nada faz para impedir o acesso aos aparelhos.",e:"Deixar de cumprir o dever de vedar ao preso acesso a aparelho telefônico: art. 319-A."},
 {a:"321",op:["321","332","317","319"],t:"Servidor do órgão previdenciário usa sua condição para ir à mesa dos colegas e acompanhar, pessoalmente, o pedido legítimo de benefício de um vizinho.",e:"Patrocinou interesse privado perante a administração valendo-se da qualidade de funcionário: advocacia administrativa (mesmo sendo legítimo o interesse)."},
 {a:"322",op:["322","329","331","316"],t:"Durante uma diligência, o funcionário, a pretexto de cumprir a ordem, agride fisicamente o morador sem qualquer necessidade.",e:"Praticar violência no exercício da função ou a pretexto de exercê-la: violência arbitrária, somada à pena da violência."},
 {a:"323",op:["323","324","319","320"],t:"Servidor simplesmente para de comparecer ao trabalho e abandona o cargo, fora dos casos permitidos em lei.",e:"Abandonar cargo público fora dos casos permitidos em lei: abandono de função."},
 {a:"324",op:["324","328","323","307"],t:"Servidor oficialmente notificado de sua exoneração continua despachando documentos no setor, sem autorização.",e:"Continuar exercendo a função depois de saber oficialmente da exoneração: exercício funcional ilegalmente prolongado."},
 {a:"325",op:["325","311-A","321","319"],t:"Escrevente conta a um jornalista detalhes de processo que tramita em segredo de justiça, dos quais soube em razão do cargo.",e:"Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo: violação de sigilo funcional."},
 {a:"325",op:["325","313-B","313-A","311-A"],t:"Servidor empresta sua senha do sistema do tribunal a um amigo, que não tem autorização, para que ele consulte dados restritos.",e:"Permitir, mediante empréstimo de senha, o acesso de pessoa não autorizada a sistema da Administração: art. 325, §1º, I."},
 {a:"311-A",op:["311-A","325","317","299"],t:"Funcionário da gráfica contratada para imprimir as provas de um concurso público vende o conteúdo do caderno antes da aplicação.",e:"Divulgar indevidamente conteúdo sigiloso de concurso público: fraude em certame de interesse público."},
 {a:"311-A",op:["311-A","325","319","320"],t:"Servidor deixa a sala com as provas do vestibular de uma universidade pública aberta, de propósito, para que o sobrinho veja as questões.",e:"Permitir ou facilitar o acesso de pessoa não autorizada a conteúdo sigiloso de processo seletivo para o ensino superior: art. 311-A, §1º."},
 {a:"328",op:["328","307","324","332"],t:"Particular se apresenta como oficial de justiça e realiza uma falsa “penhora” na casa de um devedor, sem obter nenhuma vantagem.",e:"Usurpar o exercício de função pública. Sem vantagem: forma simples (detenção)."},
 {a:"328-1",op:["328-1","328","332","316"],t:"Particular finge ser fiscal sanitário, “interdita” uma padaria e recebe dinheiro para “liberar” o local.",e:"Usurpação de função pública com obtenção de vantagem: parágrafo único do art. 328 (reclusão de 2 a 5)."},
 {a:"307",op:["307","308","299","304"],t:"Abordado pela polícia, o sujeito diz o nome do irmão para esconder seus antecedentes criminais.",e:"Atribuiu-se falsa identidade para obter vantagem. Súmula 522 do STJ: é típica mesmo em alegada autodefesa."},
 {a:"308",op:["308","307","304","297"],t:"Jovem usa como se fosse seu o RG verdadeiro do primo mais velho para entrar em uma casa noturna.",e:"Usar, como próprio, documento de identidade alheia (verdadeiro): art. 308."},
 {a:"304",op:["304","297","307","308"],t:"Motorista apresenta ao policial uma CNH que sabe ter sido falsificada.",e:"Fazer uso de documento falsificado: art. 304, com a pena da falsificação correspondente."},
 {a:"297",op:["297","299","298","304"],t:"Sujeito raspa e reescreve a data de nascimento no próprio RG para parecer maior de idade.",e:"Alterou documento público verdadeiro (falsidade material): art. 297."},
 {a:"299",op:["299","297","304","307"],t:"Na escritura pública, o vendedor declara ao tabelião que é solteiro, sabendo ser casado, para vender o imóvel sem a outorga do cônjuge.",e:"O documento é verdadeiro, mas foi inserida declaração falsa sobre fato juridicamente relevante: falsidade ideológica."},
 {a:"298",op:["298","297","299","300"],t:"Empregado imita a assinatura do patrão em um contrato particular de locação.",e:"Falsificação material de documento particular: art. 298."},
 {a:"298",op:["298","297","293","294"],t:"Quadrilha clona cartões de débito de clientes de um banco.",e:"Cartão de crédito ou débito é EQUIPARADO a documento particular (art. 298, parágrafo único)."},
 {a:"297",op:["297","298","299","305"],t:"Sobrinho falsifica o testamento particular do tio para ser incluído como herdeiro.",e:"Testamento particular é equiparado a documento público (art. 297, §2º)."},
 {a:"300",op:["300","299","301","297"],t:"Tabelião, no exercício da função, reconhece como verdadeira uma assinatura que sabe ser falsa.",e:"Reconhecer como verdadeira firma que não o seja, no exercício de função pública: art. 300."},
 {a:"301",op:["301","302","299","300"],t:"Servidor de escola pública emite certidão atestando falsamente que um aluno concluiu curso técnico, para que ele seja contratado em cargo público.",e:"Atestar falsamente, em razão de função pública, fato que habilite alguém a obter cargo público: art. 301."},
 {a:"301-1",op:["301-1","301","298","302"],t:"Particular altera, com caneta, o teor de uma certidão verdadeira de quitação eleitoral para se inscrever em concurso público.",e:"Alterar o teor de certidão verdadeira para obter vantagem: falsidade material de atestado ou certidão (art. 301, §1º)."},
 {a:"302",op:["302","301","299","298"],t:"Médico, no exercício da profissão, emite atestado dizendo que o paciente esteve internado, o que não aconteceu.",e:"Dar o médico atestado falso no exercício da profissão: art. 302."},
 {a:"305",op:["305","314","337","297"],t:"Herdeiro rasga e queima o testamento verdadeiro do pai, que o prejudicava.",e:"Destruir documento verdadeiro de que não podia dispor, em benefício próprio: supressão de documento."},
 {a:"294",op:["294","293","296","303"],t:"Polícia encontra na casa do suspeito uma máquina especialmente destinada a falsificar selos de controle tributário.",e:"Possuir ou guardar objeto especialmente destinado à falsificação de papéis públicos: petrechos de falsificação."},
 {a:"293",op:["293","297","296","298"],t:"Empresário falsifica guias de recolhimento de tributos para simular pagamentos.",e:"Guia relativa a arrecadação de rendas públicas é papel público: art. 293."},
 {a:"296",op:["296","300","297","293"],t:"Falsário fabrica um carimbo idêntico ao sinal público de um tabelião.",e:"Falsificar sinal público de tabelião: art. 296."},
 {a:"303",op:["303","296","293","298"],t:"Colecionador altera um selo filatélico raro para aumentar seu valor, sem nenhuma anotação na face ou no verso.",e:"Alterar selo filatélico com valor para coleção, sem a anotação visível: art. 303."},
 {a:"329-1",op:["329-1","329","330","331"],t:"Ao receber voz de prisão legal, o sujeito empurra e agride o policial e consegue fugir: a prisão não acontece.",e:"Resistência com violência, e o ato não se executou: forma qualificada (§1º), reclusão de 1 a 3, sem prejuízo da pena da violência."},
 {a:"329",op:["329","330","331","344"],t:"Durante a penhora determinada pelo juiz, o devedor ameaça o oficial de justiça, mas a penhora é concluída mesmo assim.",e:"Opor-se a ato legal mediante ameaça ao funcionário competente: resistência simples (o ato foi executado)."},
 {a:"330",op:["330","329","331","328"],t:"Condutor ignora a ordem legal de parada do agente e segue viagem, sem qualquer violência ou ameaça.",e:"Desobedecer a ordem legal de funcionário público, sem violência: desobediência."},
 {a:"331",op:["331","330","329","322"],t:"Inconformado com a demora, o cidadão xinga e humilha o escrevente no balcão, por causa do trabalho dele.",e:"Ofender o funcionário no exercício da função ou em razão dela: desacato."},
 {a:"332",op:["332","357","333","321"],t:"Sujeito cobra R$ 10 mil de um empresário a pretexto de influir no servidor da prefeitura que analisa um alvará.",e:"Cobrar vantagem a pretexto de influir em ato de funcionário público: tráfico de influência."},
 {a:"357",op:["357","332","343","344"],t:"Homem recebe dinheiro do réu prometendo “conversar com o juiz” para conseguir a absolvição.",e:"Receber dinheiro a pretexto de influir em JUIZ: exploração de prestígio (art. 357)."},
 {a:"336",op:["336","337","331","305"],t:"Comerciante rasga o edital afixado no mural do fórum por ordem do juiz.",e:"Rasgar edital afixado por ordem de funcionário público: art. 336."},
 {a:"336",op:["336","330","346","337"],t:"Dono do bar interditado rompe o lacre colocado pela fiscalização para voltar a funcionar.",e:"Violar selo ou sinal empregado por ordem de funcionário para cerrar objeto: art. 336."},
 {a:"339",op:["339","340","341","342"],t:"Sabendo que o vizinho é inocente, a mulher o acusa de furto e dá causa à instauração de inquérito policial contra ele.",e:"Deu causa a inquérito contra pessoa determinada, imputando crime de que a sabe inocente: denunciação caluniosa."},

  if(k==="p"){const others=PENAS.filter(p=>p!==a.pena); const same=shuffle(others.filter(p=>p[0]===a.pena[0])); const diff=shuffle(others.filter(p=>p[0]!==a.pena[0]));
    const ds=[...same.slice(0,2),...diff.slice(0,1)]; while(ds.length<3) ds.push(shuffle(others).find(p=>ds.indexOf(p)<0));

    return {id,chip:"Pena certa",prompt:`Qual é a pena de <b>${a.n}</b> (${AL(a.id)})?`,opts:op,ans:op.indexOf(a.pena),exp:artExplain(a),arts:[a.id]};}

    const ds=[...near.slice(0,2),...far].slice(0,3).map(x=>x.n); const op=shuffle([a.n,...ds]);
    return {id,chip:"Que crime é esse?",prompt:"Qual é o nome deste crime?",doc:esc(a.t),opts:op,ans:op.indexOf(a.n),exp:artExplain(a),arts:[a.id]};}

function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}
async function initRemote(){

    if(st&&(st.updated||0)>(S.updated||0)){S=merge(JSON.parse(JSON.stringify(st)));saveLocal()}

      html+=`<p class="vhead">${v.id}ª Vara · ${v.n}</p>`;
      html+=arts.map(a=>{const m=S.m[P(a.id)];return `<details class="art" id="a-${a.id}" ${a.id===openId?"open":""}><summary><span class="n">${a.al?a.al.replace("Art. ",""):a.id}</span><span class="t">${a.n}</span><span class="mdot h${m?m.s:0}"></span></summary>
      <div class="abody"><div class="doc" style="font-size:.9rem">${esc(a.t)}</div>
      ${a.pena?`<div class="pena">${a.r?`<span class="reg ${a.r}">${a.r==="R"?"RECLUSÃO":"DETENÇÃO"}</span>`:""}<span>${a.pena}</span></div>`:""}
      ${a.o&&a.o.length?`<ul>${a.o.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${a.d?`<div class="dica"><b>Macete:</b> ${esc(a.d)}</div>`:""}
      ${a.p||!ALL_IDS.some(x=>x.arts.some(y=>P(y)===a.id))?"":`<button class="btn ghost" data-train="${a.id}">Treinar este artigo</button>`}</div></details>`}).join("")});
    document.getElementById("list").innerHTML=html||`<p class="muted">Nada encontrado para essa busca.</p>`;
    document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>startArt(b.dataset.train));};
  inp.oninput=draw; draw();
  if(openId){const el=document.getElementById("a-"+openId);if(el)setTimeout(()=>el.scrollIntoView({block:"center"}),30)}
}

/* ================== RODADAS ================== */
let R=null,tInt=null;
function startVara(v){const vara=VARAS.find(x=>x.id===v);const ids=idsWhere(x=>x.arts.some(a=>vara.arts.includes(P(a))));
  startRound({mode:"vara",vara:v,title:v+"ª Vara · "+vara.n,ids:balance(ids,10)})}
function startArt(p){const ids=idsWhere(x=>x.arts.some(a=>P(a)===p));startRound({mode:"art",title:"Treino · "+A[p].n,ids:pick(ids,Math.min(8,ids.length))})}
function balance(ids,n){const by={};ids.forEach(id=>{(by[id[0]]=by[id[0]]||[]).push(id)});Object.values(by).forEach(shuffle);const out=[];const keys=shuffle(Object.keys(by));
  while(out.length<n&&keys.some(k=>by[k].length)){keys.forEach(k=>{if(out.length<n&&by[k].length)out.push(by[k].pop())})}return shuffle(out)}
function startMode(m){
  if(m==="vade")return renderVade("");
  if(m==="balcao")return startRound({mode:"balcao",title:"Caso no Balcão",ids:shuffle(idsWhere(x=>x.id[0]==="c"||x.id[0]==="n")),endless:1,lives:3});
  if(m==="pena")return startRound({mode:"pena",title:"Pena Certa",ids:shuffle(idsWhere(x=>x.id[0]==="p"||x.id[0]==="r")),endless:1,lives:3});
  if(m==="relampago")return renderIntro("Relâmpago",["Você tem <b>60 segundos</b>.","Cada item é <b>Certo ou Errado</b>, ou <b>Reclusão ou Detenção</b>.","Cada acerto vale 1 ponto. Acertos seguidos aumentam o XP.","Cada erro tira <b>4 segundos</b> do relógio.","No fim, você vê a explicação de tudo que errou."],()=>startRelampago());
  if(m==="banca")return startRound({mode:"banca",title:"Raio-X da Banca",ids:balance(idsWhere(x=>x.b),15)});
  if(m==="revisao"){const d=dueIds();if(!d.length){toast("Nada para revisar agora. Seus erros aparecem aqui.");return}return startRound({mode:"revisao",title:"Revisão",ids:shuffle(d).slice(0,20)})}
  if(m==="simulado"||m==="final"){const q=pick(idsWhere(x=>x.id[0]==="q"),11),c=pick(idsWhere(x=>x.id[0]==="c"),5),v=pick(idsWhere(x=>x.id[0]==="v"||x.id[0]==="l"),4);
    return startRound({mode:m,title:m==="final"?"Simulado final":"Simulado",ids:shuffle([...q,...c,...v])})}
}
function startRelampago(){startRound({mode:"relampago",title:"Relâmpago",ids:shuffle(idsWhere(x=>x.id[0]==="v"||x.id[0]==="r")),endless:1,timer:60,quick:1,base:5})}
function startRound(cfg){clearInterval(tInt);pendingAch=[];
  R={cfg,idx:0,ok:0,bad:0,combo:0,maxCombo:0,lives:cfg.lives||0,xp:0,ans:0,mistakes:[],queue:cfg.ids.slice(),startLv:lvl(S.xp).i};
  if(cfg.timer){R.deadline=Date.now()+cfg.timer*1000;tInt=setInterval(tick,200)}
  nextQ()}
function mult(){return 1+Math.min(4,Math.floor(R.combo/5))*.5}
function nextQ(){if(!R)return;const c=R.cfg;
  if(c.endless){if(!R.queue.length)R.queue=shuffle(c.ids.slice())}else if(R.idx>=R.queue.length)return endRound();
  const id=c.endless?R.queue.shift():R.queue[R.idx];R.q=buildQ(id);R.answered=false;screen="round";renderRound();window.scrollTo(0,0)}
function statusHTML(){const c=R.cfg;let s="";
  if(c.lives)s+=`<span class="hearts" aria-label="${R.lives} vidas">${"♥".repeat(R.lives)}${"♡".repeat(Math.max(0,3-R.lives))}</span>`;
  if(c.timer)s+=`<span class="num" id="tsec">${Math.max(0,Math.ceil((R.deadline-Date.now())/1000))}s</span>`;
  if(!c.endless)s+=`<span class="num">${Math.min(R.idx+1,R.queue.length)}/${R.queue.length}</span>`;
  else if(!c.timer)s+=`<span class="num">${R.ok} pts</span>`;
  if(c.timer)s+=`<span class="num">${R.ok} pts</span>`;
  return s}
function askQuit(){
  if(!R||R.ended){goHome();return}
  if(R.ans===0){clearInterval(tInt);R=null;goHome();return}
  if(document.getElementById("quitbar"))return;
  if(R.cfg.timer){R.pausedLeft=R.deadline-Date.now();clearInterval(tInt)}
  const d=document.createElement("div");d.id="quitbar";d.className="quitbar";
  d.innerHTML=`<b>Sair da rodada?</b><span>Suas ${R.ans} resposta(s) já estão salvas. Você vai ver o resultado parcial.${R.cfg.timer?" O relógio está pausado.":""}</span><div class="row"><button class="btn red" id="qyes">Sair</button><button class="btn ghost" id="qno">Continuar</button></div>`;
  document.querySelector(".rbar").after(d);window.scrollTo(0,0);
  document.getElementById("qyes").onclick=()=>endRound();
  document.getElementById("qno").onclick=()=>{d.remove();
    if(R.cfg.timer){R.deadline=Date.now()+R.pausedLeft;tInt=setInterval(tick,200)}
    if(R.cfg.quick&&R.answered)nextQ()};
}
function renderRound(){const q=R.q,c=R.cfg;pushNav();
  app.innerHTML=`<div class="wrap">
   <div class="rbar"><button class="back" id="quit"><span class="ch">‹</span>Sair</button><div class="rtitle">${c.title}</div><div class="rstat" id="rstat">${statusHTML()}</div></div>
   ${c.timer?`<div class="tbar" id="tbar"><i id="tfill" style="width:${Math.max(0,(R.deadline-Date.now())/(c.timer*10))}%"></i></div>`:(!c.endless?`<div class="pbar"><i style="width:${R.idx/R.queue.length*100}%"></i></div>`:"")}
   <div class="combo ${R.combo>=3?"on":""}" id="combo">${R.combo>=2?`Combo ${R.combo} · XP x${mult().toString().replace(".",",")}`:"&nbsp;"}</div>
   <article class="qcard" id="qcard"><span class="chip">${q.chip}</span><p class="prompt">${q.prompt}</p>${q.doc?`<div class="doc">${q.doc}</div>`:""}
    <div class="opts ${q.two?"two":""}">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${q.two?"":`<span class="lt">${"ABCDE"[i]}</span>`}<span>${esc(o)}</span></button>`).join("")}</div>
   </article><div id="fb"></div></div>`;
  document.getElementById("quit").onclick=askQuit;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function tick(){if(!R||R.ended)return clearInterval(tInt);const left=R.deadline-Date.now();const f=document.getElementById("tfill"),s=document.getElementById("tsec"),tb=document.getElementById("tbar");
  if(f)f.style.width=Math.max(0,left/(R.cfg.timer*10))+"%";if(s)s.textContent=Math.max(0,Math.ceil(left/1000))+"s";if(tb)tb.classList.toggle("low",left<10000);
  if(left<=0){clearInterval(tInt);endRound()}}
function answer(i){if(!R||R.answered||R.ended)return;R.answered=true;const q=R.q,c=R.cfg,right=i===q.ans;
  touchDay();R.ans++;S.day.ans++;S.tot.ans++;
  if(right){R.ok++;S.tot.ok++;R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);const g=Math.round((c.base||10)*mult());R.xp+=g;S.xp+=g;R.gain=g;sfx("ok")}
  else{R.bad++;R.combo=0;R.gain=0;if(c.lives)R.lives--;if(c.timer)R.deadline-=4000;R.mistakes.push({q,chosen:i});sfx("bad")}
  if(R.combo>=10)unlock("combo10");if(S.tot.ok>=100)unlock("centena");if(S.tot.ok>=1000)unlock("mil");
  if(c.mode==="pena"&&R.combo>=10)unlock("pena10");
  mastery(q.arts,right);srsUpdate(q.id,right);
  if(Object.values(S.m).filter(m=>m.s>=5).length>=10)unlock("mestre");
  save();
  if(!c.endless)R.idx++;
  const card=document.getElementById("qcard");
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add("ok");else if(k===i)b.classList.add("bad");else b.classList.add("dim")});
  const st=document.createElement("div");st.className="stampmark "+(right?"ok":"bad");st.textContent=right?"DEFERIDO":"INDEFERIDO";card.appendChild(st);
  if(!right)card.classList.add("shake");
  document.getElementById("rstat").innerHTML=statusHTML();
  const cb=document.getElementById("combo");cb.className="combo "+(R.combo>=3?"on":"");cb.innerHTML=R.combo>=2?`Combo ${R.combo} · XP x${mult().toString().replace(".",",")}`:"&nbsp;";
  if(c.quick){setTimeout(()=>{if(!R||R.ended||document.getElementById("quitbar"))return;if(Date.now()>=R.deadline)endRound();else nextQ()},right?380:900);return}
  const over=c.lives&&R.lives<=0;const last=!c.endless&&R.idx>=R.queue.length;
  const a=A[q.arts[0]];
  document.getElementById("fb").innerHTML=`<div class="fb ${right?"":"bad"}">
    <h4>${right?"Deferido!":"Indeferido."} ${right?`<span class="gain">+${R.gain} XP</span>`:""}</h4>
    <p>${q.exp}</p>
    <span class="fund">Fundamento: ${q.arts.slice(0,1).map(x=>AL(x)+" — "+A[x].n).join("")}</span>
    ${!right&&a.d?`<div class="dica"><b>Macete:</b> ${esc(a.d)}</div>`:""}
    <button class="btn next" id="nx">${over?"Ver sentença":last?"Ver resultado":"Próxima"}</button></div>`;
  document.getElementById("nx").onclick=()=>{over?endRound():nextQ()};
  setTimeout(()=>document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"}),60);
}
function endRound(){if(!R||R.ended)return;R.ended=true;clearInterval(tInt);const c=R.cfg,acc=R.ans?R.ok/R.ans:0;let st=null;
  touchDay();
  if(c.mode==="vara"||c.mode==="final"){st=acc>=.9?3:acc>=.7?2:acc>=.5?1:0;const k=c.mode==="final"?"final":c.vara;S.stars[k]=Math.max(S.stars[k]||0,st);S.day.camp++;
    if(st===3&&c.mode==="vara")unlock("vara3");if(allVarasDone())unlock("todas");if(c.mode==="final"&&acc>=.7)unlock("chefe")}
  if(c.mode==="simulado"&&acc>=.7)unlock("chefe");
  let rec=false;
  if(c.mode==="balcao"&&R.ok>S.best.balcao){S.best.balcao=R.ok;rec=true}
  if(c.mode==="pena"&&R.ok>S.best.pena){S.best.pena=R.ok;rec=true}
  if(c.mode==="relampago"){S.day.rel++;if(R.ok>S.best.relampago){S.best.relampago=R.ok;rec=true}if(R.ok>=20)unlock("relampago20")}
  if(c.mode==="balcao"&&R.ok>=15)unlock("balcao15");
  if(R.ans>0)unlock("primeira");
  const missionsNow=[];MISSIONS.forEach(m=>{if(!S.day.done[m.id]&&m.ok(S.day)){S.day.done[m.id]=1;S.xp+=30;missionsNow.push(m.t)}});
  save();
  const lvUp=lvl(S.xp).i>R.startLv;if(lvUp)sfx("up");
  const head=acc>=.9?"Aprovado com louvor":acc>=.7?"Aprovado":acc>=.5?"Aprovado com ressalvas":"Reprovado — recurso cabível";
  const achNow=pendingAch.slice();pendingAch=[];
  const mk=R.mistakes;
  screen="end";pushNav();
  app.innerHTML=`<div class="wrap">
   ${bar("Resultado",c.title)}
   <div class="sent"><p class="eyebrow">Sentença · ${c.title}</p><h2 class="display">${head}</h2>
    ${st!==null?`<div class="stars">${stars(st)}</div>`:""}
    ${rec?`<div class="banner">Novo recorde: ${R.ok}!</div>`:""}
    <div class="kpis num"><div class="kpi"><b>${R.ok}/${R.ans}</b><span>acertos</span></div><div class="kpi"><b>${Math.round(acc*100)}%</b><span>precisão</span></div><div class="kpi"><b>${R.maxCombo}</b><span>combo máx.</span></div><div class="kpi"><b>+${R.xp}</b><span>XP</span></div></div>
    ${lvUp?`<div class="banner">Promoção! Agora você é ${lvl(S.xp).name}.</div>`:""}
    ${missionsNow.map(t=>`<div class="banner" style="background:var(--ok);color:#fff">Pauta cumprida: ${t} (+30 XP)</div>`).join("")}
    ${achNow.length?`<div class="stamps" style="width:100%">${achNow.map(id=>{const a=ACH.find(x=>x.id===id);return `<div class="stp on"><i>✓</i><b>${a.n}</b><span>+25 XP</span></div>`}).join("")}</div>`:""}
    ${c.mode==="vara"&&st<1?`<p class="muted" style="margin:0">Faça 50% ou mais para abrir a próxima vara. Dica: leia os macetes no Vade Mecum.</p>`:""}
   </div>
   <div class="row"><button class="btn" id="again">Jogar de novo</button><button class="btn ghost" id="home">Início</button></div>
   ${c.mode==="vara"||c.mode==="final"?`<button class="btn ghost" id="map">Voltar ao mapa da campanha</button>`:""}
   ${c.mode==="art"?`<button class="btn ghost" id="vm">Voltar ao Vade Mecum</button>`:""}
   ${mk.length?`<section><div class="shead"><h3>Para não errar de novo</h3><span class="muted" style="font-size:.8rem">já foram para a Revisão</span></div><div class="errs">
     ${mk.map(m=>`<div class="err"><span class="q">${m.q.doc&&m.q.chip!=="Lei seca"?m.q.doc:m.q.prompt}</span>${m.q.chip==="Lei seca"?`<span class="muted">${m.q.doc}</span>`:""}<span class="a">Resposta: ${esc(m.q.opts[m.q.ans])}</span><span>${m.q.exp}</span></div>`).join("")}
   </div></section>`:""}
  </div>`;
  window.scrollTo(0,0);
  const cfg=c;R=null;
  document.getElementById("again").onclick=()=>{if(cfg.mode==="vara")startVara(cfg.vara);else if(cfg.mode==="art")startArt(P(cfg.ids.length?ALL_IDS.find(x=>x.id===cfg.ids[0]).arts[0]:"312"));else startMode(cfg.mode)};
  document.getElementById("home").onclick=goHome;
  document.getElementById("back").onclick=goHome;
  const mp=document.getElementById("map");if(mp)mp.onclick=renderMap;
  const vm=document.getElementById("vm");if(vm)vm.onclick=()=>renderVade("",P(ALL_IDS.find(x=>x.id===cfg.ids[0]).arts[0]));
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

/* ================== BOOT ================== */
function start(){loadLocal();renderHome();setTimeout(initRemote,0)
  if(!IN_CLAUDE&&(location.protocol==="https:"||location.hostname==="localhost")&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start();
</script>
